<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ikaw at Ako</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;

    font-family: "Poppins", sans-serif;

    background:url("ourphoto.jpeg");
    background-size:cover;
    background-position:center;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:url("ourphoto.jpeg");
    background-size:cover;
    background-position:center;

    filter:blur(9px);
    transform:scale(1.15);

    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(
        circle,
        transparent 35%,
        rgba(0,0,0,.75) 100%
    );

    z-index:-1;
}

#startScreen{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:transparent;

    z-index:20;
}

#startButton{

    padding:14px 28px;

    border-radius:999px;

    border:1px solid rgba(255,255,255,.15);

    background:rgba(255,255,255,.08);

    color:white;

    cursor:pointer;

    backdrop-filter:blur(20px);

    font-size:16px;

    transition:.3s;
}

#startButton:hover{

    transform:scale(1.05);

    background:rgba(255,255,255,.12);
}
#lyricsScreen{

    display:none;

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;
}

#musicPlayer{

    display:none;

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    width:300px;

    height:450px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:30px;

    z-index:5;
}

.controls{

    position:absolute;

    bottom:30px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:15px;

    z-index:20;
}

.controls button{

    width:45px;

    height:45px;

    border:none;

    border-radius:50%;

    background:rgba(255,255,255,.12);

    color:white;

    font-size:18px;

    cursor:pointer;
}

#songTitle{

    position:absolute;

    top:30px;

    left:50%;

    transform:translateX(-50%);

    color:#ffd700;

    font-size:22px;

    font-weight:700;

    letter-spacing:1px;

    text-shadow:
        0 0 10px rgba(255,255,255,.5);
}

#progressBar{

    position:absolute;

    bottom:80px;

    left:50%;

    transform:translateX(-50%);

    width:80%;

    z-index:20;
}

#lyricsScreen::before{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:700px;
    height:700px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(255,255,255,.08),
        transparent 70%
    );

    filter:blur(70px);
}

#lyric{

    position:absolute;

    top:80px;

    bottom:140px;

    left:20px;

    right:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:white;

    font-size:28px;

    font-weight:700;

    line-height:1.2;

    letter-spacing:-1px;

    opacity:0;

    filter:blur(8px);

    pointer-events:none;

    text-shadow:
        0 0 15px rgba(255,255,255,.8),
        0 0 40px rgba(255,255,255,.35);

    transition:
        opacity .4s ease,
        filter .4s ease;
}

#lyric.show{

    opacity:1;

    filter:blur(0);
}
.particle{

    position:absolute;

    bottom:-30px;

    opacity:0;

    pointer-events:none;

    animation:
particleFloat
12s linear forwards;
}

@keyframes particleFloat{

    0%{
        transform:translateY(0) scale(.5);
        opacity:0;
    }

    15%{
        opacity:.6;
    }

    100%{
        transform:translateY(-110vh) scale(1.4);
        opacity:0;
    }
}

#endingScreen{

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%) scale(.85);

    width:320px;

    padding:30px;

    border-radius:24px;

    background:rgba(20,20,30,.9);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.1);

    display:flex;
    flex-direction:column;
    align-items:center;

    opacity:0;

    pointer-events:none;

    transition:.4s ease;

    z-index:999;
}

#endingScreen.show{
    opacity:1;
    pointer-events:auto;
    transform:
    translate(-50%,-50%)
    scale(1);
}

#endingScreen.show{

    opacity:1;
    pointer-events:auto;
}

#endingTitle{

    color:white;

    font-size:40px;

    margin-bottom:30px;
}

#endingButtons{

    display:flex;

    gap:15px;
}

#endingButtons button{

    padding:14px 28px;

    border-radius:999px;

    border:1px solid rgba(255,255,255,.15);

    background:rgba(255,255,255,.08);

    color:white;

    cursor:pointer;
}


.corner{
    position:fixed;
    width:90px;
    height:90px;
    z-index:999;
    pointer-events:none;
}

.tl{
    top:20px;
    left:20px;
    border-top:2px solid rgba(255,255,255,.7);
    border-left:2px solid rgba(255,255,255,.7);
}

.tr{
    top:20px;
    right:20px;
    border-top:2px solid rgba(255,255,255,.7);
    border-right:2px solid rgba(255,255,255,.7);
}

.bl{
    bottom:20px;
    left:20px;
    border-bottom:2px solid rgba(255,255,255,.7);
    border-left:2px solid rgba(255,255,255,.7);
}

.br{
    bottom:20px;
    right:20px;
    border-bottom:2px solid rgba(255,255,255,.7);
    border-right:2px solid rgba(255,255,255,.7);
}

.borderGlow{

    position:fixed;

    top:15px;
    left:15px;
    right:15px;
    bottom:15px;

    border:2px solid rgba(255,158,207,.6);

    
    
    border-radius:20px;

    pointer-events:none;

    z-index:999;
}
</style>
</head>
<body>
    

<div id="startScreen">

<button id="startButton">
Tap to Start
</button>

</div>

<audio id="audio">
<source src="music.mp4" type="audio/mp4">
</audio>

<div id="lyricsScreen">

    <div id="musicPlayer">
        
        <div id="songTitle">
    IKAW AT AKO
</div>

    <div id="lyric"></div>

    <div class="controls">

        <button id="prevBtn">◀◀</button>

        <button id="playPauseBtn">❚❚</button>

        <button id="nextBtn">▶▶</button>

    </div>

        <input
            type="range"
            id="progressBar"
            value="0"
            min="0"
            max="100"
        >

    </div>

    <div id="endingScreen">

    <div id="endingButtons">

        <button id="repeatBtn">
            Play Again
        </button>

        <button id="continueBtn">
            Continue
        </button>

    </div>

</div>

</div>

</div>

<script>
const lyrics = [

{ time: 1.8, text: "Hawakan mo ang kamay ko" },

{ time: 9.3, text: "Nang napakahigpit" },

{ time: 16.8, text: "Pakinggan mo ang tinig ko" },

{ time: 24.5, text: "Ooh, 'di mo ba pansin?" },

{ time: 30.2, text: "Na ikaw at ako, ooh-whoa, oh" },

{ time: 36.8, text: "Tayo'y pinagtagpo" },

{ time: 44.3, text: "Ikaw at ako, ooh-whoa, oh" },

{ time: 51.8, text: "'Di na muling magkakalayo" }

];

const audio = document.getElementById("audio");
const lyric = document.getElementById("lyric");

const startButton = document.getElementById("startButton");
const startScreen = document.getElementById("startScreen");
const lyricsScreen = document.getElementById("lyricsScreen");

const endingScreen = document.getElementById("endingScreen");
const repeatBtn = document.getElementById("repeatBtn");
const continueBtn = document.getElementById("continueBtn");

const playPauseBtn =
document.getElementById("playPauseBtn");

const prevBtn =
document.getElementById("prevBtn");

const nextBtn =
document.getElementById("nextBtn");

const progressBar =
document.getElementById("progressBar");

let currentIndex = -1;
let changing = false;

const FADE_OUT = 180;
const BLANK_GAP = 180;

startButton.onclick = async () => {

    startScreen.style.display = "none";
lyricsScreen.style.display = "block";

document.getElementById("musicPlayer")
.style.display = "block";

    await audio.play();

    createParticles();
};

audio.addEventListener("timeupdate", () => {

    const currentTime = audio.currentTime;

    for(let i = lyrics.length - 1; i >= 0; i--){

        if(currentTime >= lyrics[i].time){

            if(currentIndex !== i && !changing){

                changing = true;

                currentIndex = i;

                lyric.classList.remove("show");

                setTimeout(() => {

                    lyric.textContent = "";

                    setTimeout(() => {

                        lyric.textContent = lyrics[i].text;

                        requestAnimationFrame(() => {

                            lyric.classList.add("show");

                            changing = false;

                        });

                    }, BLANK_GAP);

                }, FADE_OUT);
            }

            break;
        }
    }
});

audio.addEventListener("ended", () => {

    endingScreen.classList.add("show");

});

repeatBtn.onclick = () => {

    endingScreen.classList.remove("show");

    currentIndex = -1;

    changing = false;

    lyric.textContent = "";
    lyric.classList.remove("show");

    audio.pause();
    audio.currentTime = 0;

    audio.play();
};

continueBtn.onclick = () => {
    window.location.href = "lsm.html";
};

playPauseBtn.onclick = () => {

    if(audio.paused){

        audio.play();

        playPauseBtn.textContent = "❚❚";

    }else{

        audio.pause();

        playPauseBtn.textContent = "▶";

    }

};

audio.addEventListener("timeupdate",()=>{

    progressBar.value =
    (audio.currentTime /
    audio.duration) * 100;

});

progressBar.addEventListener("input",()=>{

    audio.currentTime =
    (progressBar.value / 100)
    * audio.duration;

});

prevBtn.onclick = () => {

    if(currentIndex > 0){

        audio.currentTime =
        lyrics[currentIndex - 1].time;

    }

};

nextBtn.onclick = () => {

    if(currentIndex <
    lyrics.length - 1){

        audio.currentTime =
        lyrics[currentIndex + 1].time;

    }

};

function createParticles(){

    setInterval(() => {

        const particle =
        document.createElement("div");

        particle.className = "particle";

        particle.textContent = "♡";

        particle.style.left =
        Math.random()*100 + "%";

        particle.style.fontSize =
        (10 + Math.random()*20) + "px";
        
        particle.style.color = "#ff9ecf";
        
        particle.style.textShadow =
"0 0 8px #ff9ecf, 0 0 18px #ff9ecf, 0 0 30px #ff69b4";

        lyricsScreen.appendChild(particle);

        setTimeout(() => {

            particle.remove();

        }, 9000);

    }, 700);

}

</script>

<div class="borderGlow"></div>
</body>
</html>
